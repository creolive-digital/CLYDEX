# Replace server_name with the same approved CLYDEX_PUBLIC_HOST. Supply valid TLS certificates.
limit_req_zone $binary_remote_addr zone=clydex_requests:10m rate=2r/s;
server {
    listen 443 ssl;
    server_name cloud.example.invalid;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_body_buffer_size 10m;
    access_log off;
    error_log /var/log/nginx/error.log crit;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    location / {
        limit_req zone=clydex_requests burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header Connection "";
        proxy_read_timeout 35s;
        proxy_connect_timeout 5s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
