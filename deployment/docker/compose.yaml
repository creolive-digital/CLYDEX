# Engineering deployment template. Does not download models or provision SQL.
# Run only after owner approves hosting, image digests, ODBC terms and production activation.
services:
  api:
    image: ${CLYDEX_API_IMAGE:?Provide a reviewed locally built API image digest}
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 1g
    cpus: 2
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: "3"}
    tmpfs: [/tmp:size=64m,mode=1777]
    env_file: ${CLYDEX_ENV_FILE:?Absolute non-secret cloud environment file}
    volumes:
      - ${CLYDEX_DATA_DIR:?Absolute private cloud data directory}:/var/lib/clydex
      - ${CLYDEX_KEYS_DIR:?Absolute private key directory}:/run/secrets/clydex:ro
      - ${CLYDEX_DATABASE_URL_FILE:?Absolute protected database URL file}:/run/secrets/database-url:ro
    networks: [private]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; r=urllib.request.Request('http://127.0.0.1:8000/readyz',headers={'Host':__import__('os').environ['CLYDEX_PUBLIC_HOST']}); urllib.request.urlopen(r,timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    extends: api
    command: [python, -m, clydex_cloud.cli, worker]
    healthcheck: {disable: true}
  proxy:
    image: ${CLYDEX_NGINX_IMAGE:?Provide a reviewed nginx image digest}
    restart: unless-stopped
    ports: ["127.0.0.1:8443:443"] # Loopback only. Public port exposure needs separate owner approval.
    volumes:
      - ../nginx/clydex.conf:/etc/nginx/conf.d/default.conf:ro
      - ${CLYDEX_TLS_DIR:?Private directory with fullchain.pem and privkey.pem}:/etc/nginx/tls:ro
    networks: [private]
networks:
  private:
    ipam:
      config: [{subnet: 172.31.55.0/28}]
