[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clydex"
version = "2.0.0.dev1"
description = "CLYDEX per-user desktop assistant core"
requires-python = ">=3.10"
dependencies = ["tzdata==2026.6"]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]
# Optional code runtime only. No wake/voice model is bundled or downloaded.
voice-wake = ["openwakeword>=0.6,<0.7"]
operating-sql = ["pyodbc>=5.2,<6"]
operating-camera = ["opencv-python-headless>=4.11,<5"]
operating-mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clydex.database" = ["migrations/*.sql"]
"clydex.tools" = ["*.ps1"]
"clydex.desktop" = ["hud_contract.json"]

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = ["src/clydex/core/legacy_engine.py"]

[tool.ruff.lint.per-file-ignores]
"src/clydex/desktop/widget.py" = ["E701", "E702"]
"src/clydex/desktop/hologram.py" = ["E701", "E702"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
