[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clydex"
version = "2.0.0.dev1"
description = "CLYDEX per-user desktop assistant core"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clydex.database" = ["migrations/*.sql"]
"clydex.tools" = ["*.ps1"]

[tool.ruff]
target-version = "py310"
line-length = 110
include = ["src/**/*.py", "tests/**/*.py"]
extend-exclude = ["src/clydex/core/legacy_engine.py"]

[tool.ruff.lint.per-file-ignores]
"src/clydex/desktop/widget.py" = ["E701", "E702"]
"src/clydex/desktop/hologram.py" = ["E701", "E702"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
