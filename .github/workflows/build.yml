name: Build CLYDEX Installer

on:
  push:
    branches: [ main, v2 ]
    tags:    [ 'v*' ]        # push a tag like v1.0 to auto-create a Release
  workflow_dispatch:          # lets you click "Run workflow" in the GitHub UI

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      # ── 1. Source ────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python ────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            deployment/windows/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r deployment/windows/requirements.txt
          pip install "pyinstaller>=6.0" pyinstaller-hooks-contrib
          pip install "ruff>=0.9,<1"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend contracts, components and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build

      - name: Core, intelligence and voice tests, lint and compilation
        run: |
          python -m unittest discover -v
          python -m ruff check --no-cache src tests
          python -m compileall -q src tests scripts
          node --check frontend/legacy/studio.js
          node --check frontend/legacy/intelligence.js
          node --check frontend/legacy/voice.js

      # ── 3. PyInstaller builds ────────────────────────────────
      - name: Build clydex_widget.exe
        run: python -m PyInstaller --clean --noconfirm --distpath deployment/windows/artifacts/dist --workpath deployment/windows/artifacts/build installer/pyinstaller/clydex_widget.spec

      - name: Build clydex_voice_agent.exe
        run: python -m PyInstaller --clean --noconfirm --distpath deployment/windows/artifacts/dist --workpath deployment/windows/artifacts/build installer/pyinstaller/clydex_voice_agent.spec

      # ── 4. Inno Setup ────────────────────────────────────────
      - name: Install Inno Setup 6
        run: choco install innosetup --yes --no-progress

      - name: Compile installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # ── 5. Upload ────────────────────────────────────────────
      - name: Upload installer as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: CLYDEX_Setup
          path: deployment/windows/artifacts/installer/CLYDEX_Setup.exe
          if-no-files-found: error
          retention-days: 30

      # ── 6. GitHub Release (only when a v* tag is pushed) ────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: deployment/windows/artifacts/installer/CLYDEX_Setup.exe
          generate_release_notes: true
