[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clydex-cloud"
version = "0.5.0.dev1"
description = "CLYDEX independently deployed account, sync and Knowledge Vault API"
requires-python = ">=3.11"
dependencies = ["clydex>=2.0.0.dev1", "fastapi==0.165.0", "uvicorn==0.54.0",
  "sqlalchemy==2.0.58", "pyodbc==5.5.0", "argon2-cffi==25.1.0", "cryptography==47.0.0",
  "pypdf==6.21.4", "defusedxml==0.7.1", "httpx==0.29.0"]

[project.optional-dependencies]
test = ["ruff==0.17.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"clydex_cloud.repositories" = ["migrations/*.sql"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
